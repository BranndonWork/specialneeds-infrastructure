---
# dr-cutover.yml
# Promotes Box B to live production.
#
# Steps:
#   1. Flip Cloudflare DNS: api.specialneeds.com → Box B IP
#   2. Update Cloudflare Worker secrets: MEILI_HOST + MEILI_SEARCH_KEY for Box B's Meilisearch
#   3. Trigger Meilisearch reindex on Box B
#   4. Verify API health on Box B via new DNS
#
# Prerequisites (confirm before running):
#   - Box B is provisioned, all services running (site.yml complete)
#   - secrets synced to Coolify on Box B (sync-secrets-to-coolify.yml complete)
#   - Meilisearch on Box B is seeded (run runbook-rebuild-meilisearch.md manually first)
#   - DNS TTL is low (Cloudflare proxied records use Cloudflare's TTL; still plan for 5 min propagation)
#
# See: docs/specialneeds-api/planned-work/disaster-recovery/runbook-cutover.md

- name: DR Cutover — Promote Box B to production
  hosts: localhost
  gather_facts: false

  vars:
    zone_id: "3df33cbd8f514275c7074407989b5b12"
    cloudflare_api_base: "https://api.cloudflare.com/client/v4"
    # Worker IDs — verify via: wrangler whoami / Cloudflare dashboard
    meili_worker_script_name: "meilisearch-proxy"

  tasks:
    - name: Require cutover variables
      assert:
        that:
          - cloudflare_api_token is defined
          - box_b_ipv4 is defined
          - box_b_meili_search_key is defined
        fail_msg: |
          Required variables missing. Pass:
            -e cloudflare_api_token=<token>
            -e box_b_ipv4=<Box B public IP>
            -e box_b_meili_search_key=<key from Box B Meilisearch: GET /keys with master key>

    - name: Get current api.specialneeds.com DNS record ID
      uri:
        url: "{{ cloudflare_api_base }}/zones/{{ zone_id }}/dns_records?name=api.specialneeds.com&type=A"
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
        status_code: 200
      register: dns_records

    - name: Flip api.specialneeds.com A record to Box B
      uri:
        url: "{{ cloudflare_api_base }}/zones/{{ zone_id }}/dns_records/{{ dns_records.json.result[0].id }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          content: "{{ box_b_ipv4 }}"
        status_code: 200
      register: dns_flip

    - name: Confirm DNS flip
      debug:
        msg: "api.specialneeds.com now points to {{ box_b_ipv4 }}"

    - name: Update MEILI_SEARCH_KEY in Cloudflare Worker (meilisearch-proxy)
      uri:
        url: "{{ cloudflare_api_base }}/accounts/fe1f2e378f772da0306f703d362b97f9/workers/scripts/{{ meili_worker_script_name }}/secrets"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "MEILI_SEARCH_KEY"
          text: "{{ box_b_meili_search_key }}"
          type: "secret_text"
        status_code: [200, 201]
      no_log: true

    - name: Update MEILI_HOST in Cloudflare Worker (meilisearch-proxy)
      uri:
        url: "{{ cloudflare_api_base }}/accounts/fe1f2e378f772da0306f703d362b97f9/workers/scripts/{{ meili_worker_script_name }}/secrets"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "MEILI_HOST"
          # Box B Meilisearch sslip.io URL — assigned by Coolify at deploy time
          # Find via Coolify UI or: docker inspect on Box B's meilisearch container
          text: "{{ box_b_meili_host }}"
          type: "secret_text"
        status_code: [200, 201]
      when: box_b_meili_host is defined
      no_log: true

    - name: Wait for DNS propagation (30 seconds)
      pause:
        seconds: 30

    - name: Verify API health at new IP
      uri:
        url: "https://api.specialneeds.com/health/?simple=true"
        status_code: 200
        timeout: 15
      register: health_check
      retries: 10
      delay: 10
      until: health_check.status == 200

    - name: Cutover complete
      debug:
        msg: |
          Cutover complete. api.specialneeds.com is now served by Box B ({{ box_b_ipv4 }}).
          Next: Update dns.tf box_a_ipv4/box_b_ipv4 and api_active_box vars in shared/cloudflare-dns.tf
          and run `terraform apply` to bring state in sync.
