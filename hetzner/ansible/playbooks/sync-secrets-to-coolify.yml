---
# sync-secrets-to-coolify.yml
# Reads secrets.yml mapping, fetches each value from bws, then upserts
# the env var into the target Coolify app via Coolify API.
#
# Run this whenever:
#   - A secret is rotated in bws
#   - A new Coolify app is added to Box B
#   - After coolify-restore.yml to re-hydrate env vars
#
# Usage:
#   ansible-playbook playbooks/sync-secrets-to-coolify.yml --limit box-b \
#     -e coolify_api_token=<from Coolify UI: Profile > API Tokens> \
#     -e bws_access_token=<from personal Bitwarden>
#
# Coolify app UUIDs (from infrastructure-inventory.md):
#   api.specialneeds.com: y4gcswkooskoc44ggwokcgsw

- name: Sync secrets from bws to Coolify
  hosts: coolify_hosts
  become: false
  gather_facts: false

  vars:
    secrets_map_file: "{{ playbook_dir }}/../secrets.yml"
    # Coolify app UUID for the Django API application
    # Each box has its own Coolify instance — the UUID is assigned on first deploy
    coolify_app_uuid: "{{ coolify_api_app_uuid | default('y4gcswkooskoc44ggwokcgsw') }}"

  tasks:
    - name: Load secrets mapping
      include_vars:
        file: "{{ secrets_map_file }}"
        name: secrets_map

    - name: Fetch and upsert each prod API secret to Coolify
      shell: |
        value=$(bws secret get {{ item.value }} --output json | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
        curl -sf -X PATCH \
          "{{ coolify_api_base }}/applications/{{ coolify_app_uuid }}/envs" \
          -H "Authorization: Bearer {{ coolify_api_token }}" \
          -H "Content-Type: application/json" \
          -d "{\"key\": \"{{ item.key }}\", \"value\": \"$value\", \"is_preview\": false}"
      environment:
        BWS_ACCESS_TOKEN: "{{ bws_access_token }}"
      loop: "{{ secrets_map.api.prod | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Trigger Coolify redeploy to pick up new env vars
      uri:
        url: "{{ coolify_api_base }}/applications/{{ coolify_app_uuid }}/restart"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: [200, 201]
      when: trigger_redeploy | default(false) | bool
