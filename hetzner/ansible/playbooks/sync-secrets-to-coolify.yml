---
# sync-secrets-to-coolify.yml
# Reads secrets.yml mapping, fetches each value from bws, then upserts
# the env var into the target Coolify app via Coolify API.
#
# Run this whenever:
#   - A secret is rotated in bws
#   - A new Coolify app is added to Box B
#   - After coolify-restore.yml to re-hydrate env vars
#
# Usage:
#   ansible-playbook playbooks/sync-secrets-to-coolify.yml --limit box-b \
#     -e coolify_api_token=<from Coolify UI: Profile > API Tokens> \
#     -e bws_access_token=<from personal Bitwarden>
#
# Add --check for a dry run: it lists the Coolify apps and writes nothing.
# The apps are coolify_compose_app_uuid and coolify_django_app_uuid in
# inventory/group_vars/coolify_hosts.yml.

- name: Sync secrets from bws to Coolify
  hosts: coolify_hosts
  become: false
  gather_facts: false

  vars:
    secrets_map_file: "{{ playbook_dir }}/../secrets.yml"
    # Django and the celery services read the same secrets
    coolify_app_uuids: "{{ [coolify_compose_app_uuid, coolify_django_app_uuid] | select | list }}"

  tasks:
    - name: List the Coolify apps this run writes to
      debug:
        var: coolify_app_uuids

    - name: Load secrets mapping
      include_vars:
        file: "{{ secrets_map_file }}"
        name: secrets_map

    - name: Fetch and upsert each prod API secret to each Coolify app
      shell: |
        value=$(bws secret get {{ item.1.value }} --output json | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
        curl -sf -X PATCH \
          "{{ coolify_api_base }}/applications/{{ item.0 }}/envs" \
          -H "Authorization: Bearer {{ coolify_api_token }}" \
          -H "Content-Type: application/json" \
          -d "{\"key\": \"{{ item.1.key }}\", \"value\": \"$value\", \"is_preview\": false}"
      environment:
        BWS_ACCESS_TOKEN: "{{ bws_access_token }}"
      loop: "{{ coolify_app_uuids | product(secrets_map.api.prod | dict2items) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1.key }}"
      no_log: true

    - name: Trigger Coolify redeploy to pick up new env vars
      uri:
        url: "{{ coolify_api_base }}/applications/{{ item }}/restart"
        method: GET
        headers:
          Authorization: "Bearer {{ coolify_api_token }}"
        status_code: [200, 201]
      loop: "{{ coolify_app_uuids }}"
      when: trigger_redeploy | default(false) | bool
