---
# Monitor Django containers: the compose app names them django-<app>-<ts>, and the
# django app names them <app-uuid>-<ts>
source: docker
container_name_regexp:
    - "^django-.*"
{% if coolify_django_app_uuid %}
    - "^{{ coolify_django_app_uuid }}-.*"
{% endif %}
labels:
    type: django
---
# Monitor Traefik/Coolify proxy logs
source: file
filename: /var/log/traefik/*.log
labels:
    type: traefik
