---
- name: Check if bws is already installed
  stat:
    path: /usr/local/bin/bws
  register: bws_binary

- name: Download bws CLI zip
  get_url:
    url: "https://github.com/bitwarden/sdk-sm/releases/download/bws-v{{ bws_cli_version }}/bws-x86_64-unknown-linux-gnu-{{ bws_cli_version }}.zip"
    dest: /tmp/bws.zip
    mode: "0644"
  when: not bws_binary.stat.exists

- name: Install unzip (required to extract bws)
  apt:
    name: unzip
    state: present
  when: not bws_binary.stat.exists

- name: Extract bws binary
  unarchive:
    src: /tmp/bws.zip
    dest: /usr/local/bin/
    remote_src: yes
    creates: /usr/local/bin/bws
  when: not bws_binary.stat.exists

- name: Set bws binary permissions
  file:
    path: /usr/local/bin/bws
    mode: "0755"
    owner: root
    group: root

- name: Create /etc/bws directory (root-only)
  file:
    path: /etc/bws
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Write bws access token
  copy:
    content: "{{ bws_access_token }}"
    dest: "{{ bws_token_path }}"
    mode: "0600"
    owner: root
    group: root
  no_log: true

- name: Verify bws can reach specialneeds-api project
  command: bws project list
  environment:
    BWS_ACCESS_TOKEN: "{{ bws_access_token }}"
  register: bws_verify
  changed_when: false
  no_log: true

- name: Assert specialneeds-api project is accessible
  assert:
    that: "'specialneeds-api' in bws_verify.stdout"
    fail_msg: "bws verification failed — specialneeds-api project not found. Check bws_access_token."
