services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: sn-openobserve
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${OPENOBSERVE_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_PASSWORD}
      - ZO_DATA_DIR=/data
    volumes:
      - openobserve_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - observability-network
      - sn-services-net

  vector:
    image: timberio/vector:latest-alpine
    container_name: sn-vector
    restart: unless-stopped
    env_file:
      - .env.observability
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      - openobserve
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - observability-network

networks:
  observability-network:
    driver: bridge
  sn-services-net:
    external: true

volumes:
  openobserve_data:
    driver: local
