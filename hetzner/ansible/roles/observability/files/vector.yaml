sources:
  docker_logs:
    type: docker_logs
    exclude_containers:
      - sn-metrics
  prod_metrics_lines:
    type: docker_logs
    include_containers:
      - sn-metrics

transforms:
  parse_metrics:
    type: remap
    inputs:
      - prod_metrics_lines
    drop_on_abort: true
    source: |
      parsed, err = parse_json(string!(.message))
      if err != null || !is_object(parsed) { abort }
      . = parsed


  parse_level:
    type: remap
    inputs:
      - docker_logs
    source: |
      .log_level = "INFO"
      if contains(string!(.message), "DEBUG") { .log_level = "DEBUG" }
      if contains(string!(.message), "WARNING") || contains(string!(.message), "WARN") { .log_level = "WARNING" }
      if contains(string!(.message), "ERROR") { .log_level = "ERROR" }
      if contains(string!(.message), "CRITICAL") { .log_level = "CRITICAL" }

sinks:
  openobserve:
    type: http
    inputs:
      - parse_level
    uri: "http://openobserve:5080/api/default/specialneeds/_json"
    method: post
    auth:
      strategy: basic
      user: "${OPENOBSERVE_EMAIL}"
      password: "${OPENOBSERVE_PASSWORD}"
    encoding:
      codec: json
    batch:
      timeout_secs: 5
  openobserve_metrics:
    type: http
    inputs:
      - parse_metrics
    uri: "http://openobserve:5080/api/default/prod_metrics/_json"
    method: post
    auth:
      strategy: basic
      user: "${OPENOBSERVE_EMAIL}"
      password: "${OPENOBSERVE_PASSWORD}"
    encoding:
      codec: json
    batch:
      timeout_secs: 5
