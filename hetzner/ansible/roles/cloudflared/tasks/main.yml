---
# cloudflared runs outside Coolify at /data/cloudflared/ on the `coolify` Docker network.
# Every backend hostname reaches Traefik through this tunnel.
# The tunnel token arrives in the environment variable CLOUDFLARE_TUNNEL_TOKEN of the
# ansible-playbook process. The laptop Keychain store holds it under the same name with a
# prod__api__ prefix, so run the playbook through the secrets plugin:
#   secrets reveal run "ansible-playbook ..." with global
# A fresh token comes from terraform/scripts/cloudflare_tunnel.py or the Zero Trust dashboard.
# See docs/specialneeds-infrastructure/cloudflare-tunnel-runbook.md.

- name: Create /data/cloudflared directory
  file:
    path: /data/cloudflared
    state: directory
    mode: "0755"

- name: Read the tunnel token from the controller environment
  set_fact:
    cloudflare_tunnel_token: "{{ lookup('env', 'prod__api__CLOUDFLARE_TUNNEL_TOKEN') or lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"
  no_log: true

- name: Refuse to run without a tunnel token
  assert:
    that: cloudflare_tunnel_token | length > 0
    fail_msg: "Set prod__api__CLOUDFLARE_TUNNEL_TOKEN (or CLOUDFLARE_TUNNEL_TOKEN) in the environment of ansible-playbook."

- name: Deploy cloudflared compose file
  copy:
    src: docker-compose.yml
    dest: /data/cloudflared/docker-compose.yml
    mode: "0644"

- name: Write tunnel token file
  copy:
    content: "TUNNEL_TOKEN={{ cloudflare_tunnel_token }}"
    dest: /data/cloudflared/tunnel.token
    mode: "0600"
    owner: root
    group: root
  no_log: true

- name: Start cloudflared
  community.docker.docker_compose_v2:
    project_src: /data/cloudflared
    project_name: cloudflared
    state: present
